name: Publish verified KHUX installer 2.0.1

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-installer-201.yml]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: khux-installer-v201-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: qqCLUTCHYqq/khux-theater-tracker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify the existing installer and rollback; prepare only permitted assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile, os, shutil
          pins = {
              'KHUX-Windows-Setup.zip': '1179a56f31522084eba6df84d5547cb840bae4cc708bb09c535639df47f06e20',
              'KHUX-Windows-Setup-2.0.0.zip': '3a0bd55dcea5bb814e16307999ab3d62b640ee6f67a0006f6eea694486a24b6c',
          }
          allowed = {'START SETUP.cmd', 'README.txt', 'App/Install-KHUX.ps1', 'App/Downloader.cs', 'App/Content-manifest.json', 'App/editor-guide.html'}
          assets = Path(os.environ['RUNNER_TEMP']) / 'khux-release-assets'
          assets.mkdir(exist_ok=True)
          for name, digest in pins.items():
              p = Path(name)
              assert hashlib.sha256(p.read_bytes()).hexdigest() == digest, name
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None
                  if name == 'KHUX-Windows-Setup.zip': assert set(z.namelist()) == allowed
              shutil.copyfile(p, assets/name)
          (assets/'SHA256SUMS.txt').write_text(''.join(d+'  '+n+'\n' for n,d in pins.items()), encoding='ascii')
          PY
      - name: Create draft, upload and verify assets, then publish the stable release
        run: |
          if gh release view v2.0.1 >/dev/null 2>&1; then
            test "$(gh release view v2.0.1 --json isDraft --jq .isDraft)" = true
          else
            gh release create v2.0.1 --draft --target "$GITHUB_SHA" --title 'KHUX Browser Installer 2.0.1' --notes-file .github/release-notes/v2.0.1.md
          fi
          gh release upload v2.0.1 "$RUNNER_TEMP/khux-release-assets/KHUX-Windows-Setup.zip" "$RUNNER_TEMP/khux-release-assets/KHUX-Windows-Setup-2.0.0.zip" "$RUNNER_TEMP/khux-release-assets/SHA256SUMS.txt" --clobber
          mkdir -p "$RUNNER_TEMP/khux-release-verify"
          gh release download v2.0.1 --dir "$RUNNER_TEMP/khux-release-verify" --pattern KHUX-Windows-Setup.zip --pattern KHUX-Windows-Setup-2.0.0.zip --pattern SHA256SUMS.txt
          (cd "$RUNNER_TEMP/khux-release-verify" && sha256sum -c SHA256SUMS.txt)
          gh release edit v2.0.1 --draft=false --latest --notes-file .github/release-notes/v2.0.1.md
      - name: Point the existing Pages button to the latest stable release
        run: |
          git fetch origin main
          git checkout -B release-pages-link origin/main
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          data = p.read_bytes()
          old = b'href="KHUX-Windows-Setup.zip" download'
          new = b'href="https://github.com/qqCLUTCHYqq/khux-theater-tracker/releases/latest/download/KHUX-Windows-Setup.zip"'
          if old in data:
              assert data.count(old) == 1
              p.write_bytes(data.replace(old,new,1))
          else:
              assert data.count(new) == 1
          PY
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- index.html
            git commit -m 'Point KHUX Pages download to latest stable GitHub Release'
            git push origin HEAD:main
          fi
          gh api --method POST repos/qqCLUTCHYqq/khux-theater-tracker/pages/builds
